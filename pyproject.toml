[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manki"
version = "0.2.0"
description = "Gerador automático de flashcards de mandarim para o Anki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genanki>=0.13",
    "google-genai>=1.0",
    "gTTS>=2.5",
    "lxml>=5.0",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
manki = "manki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
